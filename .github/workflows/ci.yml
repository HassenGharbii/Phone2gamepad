name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build windows-app/Phone2Gamepad.sln -c Release --nologo
      - name: Test
        # Real-driver tests are not part of this project; the suite uses the mock gamepad and loopback sockets.
        run: dotnet test windows-app/tests/Phone2Gamepad.Tests -c Release --no-build --nologo

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        working-directory: android-app
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --console=plain
